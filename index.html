<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Estudiantes</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <aside class="sidebar">
    <h2 class="sidebar-title">| CRUD OPERATIONS</h2>
    <div class="perfil">
      <img src="./img/Profile.jpg" alt="Usuario">
      <p class="nombre">Juan Admin</p>
      <p class="rol">Adminin</p>
    </div>
    <nav class="menu">
      <a href="#inicio">Inicio</a>
      <a href="#cursos">Cursos</a>
      <a href="#usuarios">Usuarios</a>
      <a href="#pagos">Pagos</a>
      <a href="#reportes">Reportes</a>
      <a href="#configuracion">Configuración</a>
    </nav>
    <button class="logout">Cerrar sesión</button>
  </aside>

  <main class="contenido">
    <!-- INICIO -->
    <section id="inicio" class="spa-section">
      <header>
        <h1>Students List</h1>
        <button onclick="showForm()">Agregar Estudiante</button>
      </header>
      <form id="studentForm" class="student-card" style="display: none;">
        <img src="./img/Useer_Profile.jpg" alt="Usuario" class="form-avatar">
        <h2 class="form-title">Register New Student</h2>
        
        <input type="hidden" id="studentId">

        <label class="fullname-center" for="name">Full name</label>
        <input type="text" id="name" placeholder="Nombre" required> 

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Email" required>

        <label for="phone">Phone</label>
        <input type="text" id="phone" placeholder="Teléfono" required>

        <label for="enrollNumber">Matrícula</label>
        <input type="text" id="enrollNumber" placeholder="Matrícula" required>

        <label for="dateOfAdmission">Date of Admission</label>
        <input type="date" id="dateOfAdmission" required>

        <div class="form-buttons">
          <button type="button" onclick="hideForm()">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
      <table id="studentTable">
        <thead>
          <tr>
            <th class="center-Nombre">Nombre</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Matrícula</th>
            <th>Fecha ingreso</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>


  </main>
  <script src="./src/script.js"></script>
  <script>
    // SPA navigation
    function showSection(hash) {
      document.querySelectorAll('.spa-section').forEach(sec => sec.style.display = 'none');
      const section = document.querySelector(hash);
      if (section) section.style.display = '';
    }
    window.addEventListener('hashchange', () => {
      showSection(location.hash || '#inicio');
    });
    // Inicializar en la sección correcta
    showSection(location.hash || '#inicio');
  </script>
</body>
</html>
