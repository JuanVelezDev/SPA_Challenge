<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Estudiantes</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="perfil">
      <img src="./img/Profile.jpg" alt="Usuario">
      <p class="nombre">Juan Admin</p>
      <p class="rol">Administrador</p>
    </div>
    <nav class="menu">
      <a href="#">Inicio</a>
      <a href="#">Cursos</a>
      <a href="#">Usuarios</a>
      <a href="#">Pagos</a>
      <a href="#">Reportes</a>
      <a href="#">Configuración</a>
    </nav>
    <button class="logout">Cerrar sesión</button>
  </aside>

  <main class="contenido">
    <header>
      <h1>Lista de Estudiantes</h1>
      <button onclick="showForm()">Agregar Estudiante</button>
    </header>

    <form id="studentForm" style="display:none;">
      <input type="hidden" id="studentId">
      <input type="text" id="name" placeholder="Nombre" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="text" id="phone" placeholder="Teléfono" required>
      <input type="text" id="enrollNumber" placeholder="Matrícula" required>
      <input type="text" id="dateOfAdmission" placeholder="Fecha ingreso" required>
      <button type="submit">Guardar</button>
      <button type="button" onclick="hideForm()">Cancelar</button>
    </form>

    <table id="studentTable">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Matrícula</th>
          <th>Fecha ingreso</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="script.js"></script>
</body>
</html>
