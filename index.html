<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crud Operarions</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <aside class="sidebar">
    <h2 class="sidebar-title">| CRUD OPERATIONS</h2>
    <div class="perfil">
      <img src="./img/Profile.jpg" alt="Usuario">
      <p class="nombre">Juan Admin</p>
      <p class="rol">Admin</p>
    </div>
    <nav class="menu">
      <a href="#inicio">Inicio</a>
      <a href="#cursos">Cursos</a>
      <a href="#usuarios">Usuarios</a>
      <a href="#pagos">Pagos</a>
      <a href="#reportes">Reportes</a>
      <a class="logout-title" href="#configuracion">Configuración</a>
      <a href="#Logout">Logout<img src="./img/sign-out-alt 1.png" alt="Logo" class="logout"></a>
    </nav>

    <!-- <img src="./img/sign-out-alt 1.png" alt="Logo" class="logout"> -->
    
  </aside>

  <main class="contenido">
    <!-- INICIO -->
    <section id="inicio" class="spa-section">
      <header>
        <h2>Students List</h2>
        <svg class= "vectorIcon"     width="14" height="25" viewBox="0 0 14 20" xmlns="http://www.w3.org/2000/svg"><path d="M12.6 11.375H1.4c-1.243 0-1.873 1.482-.989 2.346l5.6 5.5a1.42 1.42 0 0 0 1.982 0l5.6-5.5c.875-.864.25-2.346-.993-2.346M7 18.25l-5.6-5.5h11.2zM1.4 8.625h11.2c1.242 0 1.873-1.482.989-2.346l-5.6-5.5a1.42 1.42 0 0 0-1.982 0l-5.6 5.5c-.875.864-.25 2.346.993 2.346M7 1.75l5.6 5.5H1.4z" fill="CurrentColor"/></svg>
        <button onclick="showForm()">ADD NEW STUDENT</button>
      </header>
      <form id="studentForm" class="student-card" style="display: none;">
        <img src="./img/Useer_Profile.jpg" alt="Usuario" class="form-avatar">
        <h2 class="form-title">Register New Student</h2>
        
        <input type="hidden" id="studentId">

        <label class="fullname-center" for="name">Full name</label>
        <input type="text" id="name" placeholder="Nombre" required> 

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Email" required>

        <label for="phone">Phone</label>
        <input type="text" id="phone" placeholder="Teléfono" required>

        <label for="enrollNumber">Matrícula</label>
        <input type="text" id="enrollNumber" placeholder="Matrícula" required>

        <label for="dateOfAdmission">Date of Admission</label>
        <input type="date" id="dateOfAdmission" required>

        <div class="form-buttons">
          <button type="button" onclick="hideForm()">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
      <table id="studentTable">
        <thead>
          <tr>
            <th class="center-Nombre">Nombre</th>
            <th style="color: #ACACAC;">Email</th>
            <th style="color:#ACACAC">Teléfono</th>
            <th style="color:#ACACAC">Matrícula</th>
            <th style="color:#ACACAC">Fecha ingreso</th>
            <th style="color:#ACACAC">Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>


  </main>
  <script src="./src/script.js"></script>
  <script>
    // SPA navigation
    function showSection(hash) {
      document.querySelectorAll('.spa-section').forEach(sec => sec.style.display = 'none');
      const section = document.querySelector(hash);
      if (section) section.style.display = '';
    }
    window.addEventListener('hashchange', () => {
      showSection(location.hash || '#inicio');
    });
    // Inicializar en la sección correcta
    showSection(location.hash || '#inicio');
  </script>
</body>
</html>
